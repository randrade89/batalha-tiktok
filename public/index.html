<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Batalha TikTok Live - Central</title>
  <style>
    body {
      background: #0f111a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 20px;
    }
    .card {
      background: #1a1d2e;
      border: 1px solid #2d314d;
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    a {
      display: block;
      margin: 12px 0;
      padding: 14px 20px;
      background: #ff0055;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      transition: 0.2s;
    }
    a:hover { background: #ff3377; transform: translateY(-2px); }
    a.admin { background: #3b82f6; }
    a.admin:hover { background: #60a5fa; }
  </style>
</head>
<body>
  <div class="card">
    <h2>⚔️ Central da Batalha TikTok Live</h2>
    <p style="color: #9ca3af; margin: 15px 0;">Escolha o que deseja abrir:</p>
    <a href="/admin.html" class="admin">🎮 Abrir Painel do Apresentador (Admin)</a>
    <a href="/overlay.html" target="_blank">📺 Abrir Overlay de Transmissão</a>
  </div>
</body>
</html>
